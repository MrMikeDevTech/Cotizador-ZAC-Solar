appId: com.mrmikedev.cotizador
productName: Cotizador
copyright: Copyright © 2026 MrMikeDev
directories:
  output: release
# main.js/preload.js ya son bundles (bun build) con @cotizador/backend,
# @cotizador/shared y @cotizador/cfe-scraper incluidos. Los únicos externos del
# bundle son better-sqlite3 (nativo), @prisma/client y su adaptador: están
# declarados como dependencias de este paquete y electron-builder los recolecta
# solo con eso (computeNodeModuleFileSets resuelve el árbol de producción, y con
# bun los módulos viven izados en el node_modules de la raíz del monorepo — un
# patrón `node_modules/...` aquí no apuntaría a nada).
files:
  - electron/dist/**/*
  - renderer/out/**/*
  - package.json
# Copia las migraciones de Prisma (SQL, no código) como recurso aparte —
# resolveMigrationsDir() en main.ts las busca en resources/backend-prisma-migrations.
extraResources:
  - from: ../backend/prisma/migrations
    to: backend-prisma-migrations
  # Datos de idioma del OCR de recibos CFE (spa.traineddata). main.ts apunta
  # TESSDATA_DIR a resources/tessdata; al ser un recurso va fuera del asar.
  - from: ../backend/assets/tessdata
    to: tessdata
    filter:
      - "**/*.traineddata"
# better-sqlite3 es un módulo nativo: no puede vivir dentro del asar y debe
# recompilarse contra el ABI de Electron (no el de Node/Bun usado en desarrollo).
asarUnpack:
  - node_modules/better-sqlite3/**/*
  # OCR de recibos CFE (lectura de PDF sin conexión). Todo es JS/WASM, pero el
  # worker de tesseract.js (worker_threads) y los .wasm deben ser archivos reales
  # y no entradas del asar. El worker se ejecuta desde la carpeta desempaquetada
  # y resuelve sus dependencias desde ahí, así que se desempaqueta toda la
  # cadena de tesseract.js, no solo el paquete.
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/@hyzyla/pdfium/**/*
  - node_modules/bmp-js/**/*
  - node_modules/idb-keyval/**/*
  - node_modules/is-url/**/*
  - node_modules/node-fetch/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/tr46/**/*
  - node_modules/webidl-conversions/**/*
  - node_modules/regenerator-runtime/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/zlibjs/**/*
npmRebuild: true
win:
  target: nsis
  # Generado desde renderer/public/logo.jpeg (ver README). Sin esto, el
  # ejecutable y el instalador saldrían con el logotipo genérico de Electron.
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Instalación por usuario: no pide permisos de administrador al cliente.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cotizador
